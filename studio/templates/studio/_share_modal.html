{% load ui_i18n %}
<div class="workspace-share-modal" data-share-modal data-resource-type="{{ share_resource_type }}" data-resource-id="{{ share_resource_id|default:'' }}" hidden>
  <div class="workspace-share-backdrop" data-share-close></div>
  <section class="workspace-share-dialog" role="dialog" aria-modal="true" aria-labelledby="workspace-share-title">
    <header>
      <span>{% ui "workspace_sharing" %}</span>
      <button type="button" data-share-close aria-label="{% ui "close" %}"></button>
    </header>
    <h2 id="workspace-share-title">{% ui "share_project" %}</h2>
    <div class="workspace-share-preview" data-share-preview>
      <div class="workspace-share-thumb" data-share-preview-thumb></div>
      <div>
        <strong data-share-resource-title>{% ui "project_invite" %}</strong>
        <span data-share-resource-label>{% ui "private_project_link" %}</span>
        <small>{% ui "share_valid_note" %}</small>
      </div>
    </div>
    <form data-share-form>
      <input type="email" name="email" placeholder="teammate@example.com" autocomplete="email" required>
      <input type="hidden" name="role" value="viewer">
      <button type="submit">{% ui "send_invite" %}</button>
      <div class="workspace-role-picker" data-role-picker aria-label="{% ui "access_role" %}">
        <button class="is-active" type="button" data-role-option="viewer" aria-pressed="true">
          <span>{% ui "view" %}</span>
          <small>{% ui "preview_only" %}</small>
        </button>
        <button type="button" data-role-option="editor" aria-pressed="false">
          <span>{% ui "edit" %}</span>
          <small>{% ui "save_changes" %}</small>
        </button>
      </div>
    </form>
    <div class="workspace-share-status" data-share-status></div>
    <div class="workspace-share-toolbar">
      <strong>{% ui "invited_people" %}</strong>
      <button type="button" data-share-copy-latest hidden>{% ui "copy_latest_link" %}</button>
    </div>
    <div class="workspace-share-list" data-share-list></div>
  </section>
</div>
